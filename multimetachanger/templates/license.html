<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiMetaChanger — Activation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #080812;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Fond animé */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 80% 80%, rgba(139,92,246,0.12) 0%, transparent 60%);
            pointer-events: none;
        }

        .card {
            position: relative;
            background: rgba(15, 15, 30, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 60px rgba(99,102,241,0.08);
            backdrop-filter: blur(20px);
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 8px 24px rgba(99,102,241,0.4);
        }

        .logo-text h1 { font-size: 1.2rem; font-weight: 700; color: #f1f5f9; }
        .logo-text p  { font-size: 0.78rem; color: #64748b; margin-top: 2px; }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.6rem;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 1rem 1.2rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            letter-spacing: 2px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        input[type="text"]::placeholder { color: #334155; letter-spacing: 1px; font-family: 'Inter', sans-serif; }
        input[type="text"]:focus {
            border-color: rgba(99,102,241,0.6);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }

        .btn-activate {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(99,102,241,0.35);
            letter-spacing: 0.5px;
        }
        .btn-activate:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 10px 32px rgba(99,102,241,0.4); }
        .btn-activate:active { transform: translateY(0); }
        .btn-activate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .status-box {
            display: none;
            margin-top: 1.2rem;
            padding: 0.9rem 1.2rem;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .status-box.error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
        .status-box.success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3);  color: #86efac; }
        .status-box.loading { background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); color: #a5b4fc; }

        .separator { 
            border: none; 
            border-top: 1px solid rgba(255,255,255,0.07); 
            margin: 2rem 0; 
        }

        .buy-link {
            text-align: center;
            font-size: 0.88rem;
            color: #475569;
        }
        .buy-link a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
        }
        .buy-link a:hover { text-decoration: underline; }

        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">🚀</div>
            <div class="logo-text">
                <h1>MultiMetaChanger</h1>
                <p>Activation de la licence</p>
            </div>
        </div>

        <h2>Entrez votre clé</h2>
        <p class="subtitle">
            Vous avez reçu votre clé par email après votre achat.<br>
            Format : <code style="color:#818cf8">MMC-XXXX-XXXX-XXXX-XXXX</code>
        </p>

        <form id="form-activate">
            <label for="license-input">Clé de licence</label>
            <div class="input-wrapper">
                <input
                    type="text"
                    id="license-input"
                    placeholder="MMC-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX"
                    maxlength="39"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>

            <button type="submit" class="btn-activate" id="btn-submit">
                🔑 Activer ma licence
            </button>
        </form>

        <div id="status-box" class="status-box"></div>

        <hr class="separator">

        <p class="buy-link">
            Pas encore de licence ?
            <a href="https://votre-site.com" target="_blank">Obtenez-en une ici →</a>
        </p>
    </div>

    <script>
        const form        = document.getElementById('form-activate');
        const input       = document.getElementById('license-input');
        const btnSubmit   = document.getElementById('btn-submit');
        const statusBox   = document.getElementById('status-box');

        // Auto-format : majuscules uniquement, pas de reformatage (la clé est collée telle quelle)
        input.addEventListener('input', () => {
            let val = input.value.toUpperCase();
            // Garder uniquement lettres, chiffres et tirets
            val = val.replace(/[^A-Z0-9\-]/g, '');
            // S'assurer que ça commence par MMC-
            if (val && !val.startsWith('MMC')) val = '';
            input.value = val;
        });

        function showStatus(type, msg) {
            statusBox.className = `status-box ${type}`;
            statusBox.innerHTML = msg;
            statusBox.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = input.value.trim();
            if (!key || !key.startsWith('MMC-')) {
                showStatus('error', '❌ Clé invalide. Vérifiez votre email d\'achat.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span class="spinner"></span> Vérification en cours...';
            showStatus('loading', '⏳ Connexion au serveur de licences...');

            try {
                const resp = await fetch('/api/activate-license', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const data = await resp.json();

                if (data.valid) {
                    showStatus('success', `✅ <strong>Licence activée !</strong><br>Plan : <strong>${data.plan.toUpperCase()}</strong> | Expire : ${data.expires}<br><br>Redirection dans 2 secondes...`);
                    setTimeout(() => { window.location.href = '/'; }, 2000);
                } else {
                    showStatus('error', `❌ ${data.reason || 'Clé invalide ou expirée.'}`);
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '🔑 Activer ma licence';
                }
            } catch (err) {
                showStatus('error', '❌ Impossible de joindre le serveur. Vérifiez votre connexion internet.');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '🔑 Activer ma licence';
            }
        });
    </script>
</body>
</html>
